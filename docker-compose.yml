version: "3.8"

services:
  # Spatial Relational Database
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: satledger-db
    environment:
      POSTGRES_USER: satledger
      POSTGRES_PASSWORD: satledger_secret
      POSTGRES_DB: satledger_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satledger -d satledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: satledger-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Python Processing & ML Engine
  processing:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.processing
    container_name: satledger-processing
    environment:
      PROCESSING_PORT: 8081
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    depends_on:
      - minio

  # Go Application REST API
  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    container_name: satledger-api
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: satledger
      DB_PASSWORD: satledger_secret
      DB_NAME: satledger_db
      PY_WORKER_URL: http://processing:8081
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      processing:
        condition: service_started

  # React Web Frontend
  web:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web
    container_name: satledger-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
